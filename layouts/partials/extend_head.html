
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.css"
>

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/contrib/auto-render.min.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    if (typeof renderMathInElement !== "function") {
      console.error("KaTeX auto-render 加载失败");
      return;
    }

    document.querySelectorAll(".post-content, .book-content").forEach(function (element) {
      renderMathInElement(element, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "\\[", right: "\\]", display: true },
          { left: "\\(", right: "\\)", display: false }
        ],
        throwOnError: false
      });
    });
  });
</script>
